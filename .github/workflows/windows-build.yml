name: Windows build and self-test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Compile Nexxa Remote
        shell: pwsh
        run: |
          if (Test-Path build) { Remove-Item build -Recurse -Force }
          New-Item -ItemType Directory build | Out-Null
          javac --release 21 -encoding UTF-8 -Xlint:all -d build NexxaRemote.java
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          jar --create --file build/NexxaRemote.jar --manifest manifest.mf -C build .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run built-in self-test
        shell: pwsh
        run: |
          java -Djava.awt.headless=true -jar build/NexxaRemote.jar --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
